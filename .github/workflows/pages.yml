# Build site/dist/ and publish site/ on GitHub Pages.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # The scikit-robot release the page runs; MujocoRobotInterface and
      # Jedy(light=True) need 0.4.9 or later, room 13BC (textures, a URDF
      # model as an object, room13bc_urdfpath(light=True)) 0.4.18.
      - run: python -m pip install pip coacd scikit-robot==0.4.18
      - run: python tools/build.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
